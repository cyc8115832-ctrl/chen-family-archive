<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>陳家照片回憶錄 — 家庭專屬影音相簿</title>
  
  <!-- Web App / PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="陳家相簿">
  <meta name="theme-color" content="#121316">
  <link rel="apple-touch-icon" href="https://img.youtube.com/vi/8Qg4wBKaZ7w/hqdefault.jpg">

  <style>
    :root {
      --bg-main: #121316;
      --bg-card: #1c1e24;
      --bg-card-hover: #252830;
      --border-color: rgba(255, 255, 255, 0.08);
      --gold-primary: #d4af37;
      --gold-light: #f5d77f;
      --gold-dark: #997c22;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-red: #ef4444;
      --radius: 14px;
      --shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      line-height: 1.6;
      padding-bottom: 80px;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* Header */
    header {
      background: linear-gradient(180deg, rgba(28,30,36,0.95) 0%, rgba(18,19,22,0.85) 100%);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: 2.2rem 1.5rem 1.2rem;
      text-align: center;
      position: relative;
      z-index: 100;
    }

    .brand-container {
      max-width: 1000px;
      margin: 0 auto;
    }

    .logo-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--gold-light);
      background: rgba(212, 175, 55, 0.12);
      border: 1px solid rgba(212, 175, 55, 0.25);
      padding: 4px 14px;
      border-radius: 999px;
      margin-bottom: 0.8rem;
    }

    h1 {
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--gold-light);
      margin-bottom: 0.3rem;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 1rem;
    }

    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 1.2rem;
      flex-wrap: wrap;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 1.2rem;
    }
    .stat-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .stat-item strong {
      color: var(--gold-primary);
    }

    /* Search & Filter Controls */
    .controls {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .search-wrapper {
      position: relative;
      width: 100%;
    }

    .search-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-color);
      border-radius: 999px;
      padding: 12px 20px 12px 45px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: all 0.25s ease;
    }
    .search-input:focus {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--gold-primary);
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.2);
    }
    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      opacity: 0.5;
      font-size: 1.1rem;
    }
    .clear-btn {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.1rem;
      display: none;
    }

    /* Year Tabs Pill Bar (Responsive Wrap into Neat Rows) */
    .year-tabs {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      padding: 6px 2px;
    }

    .year-tab-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .year-tab-btn:hover, .year-tab-btn.active {
      background: var(--gold-primary);
      color: #000;
      font-weight: 700;
      border-color: var(--gold-primary);
      box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
    }

    /* Main Content */
    main {
      max-width: 1200px;
      margin: 2rem auto 0;
      padding: 0 1rem;
    }

    /* Playlist Section */
    .playlist-section {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 2rem;
      box-shadow: var(--shadow);
      transition: border-color 0.2s;
    }
    .playlist-section:hover {
      border-color: rgba(212, 175, 55, 0.3);
    }

    .playlist-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 1rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 1rem;
      margin-bottom: 1.2rem;
    }

    .playlist-title-area h2 {
      font-size: 1.35rem;
      color: var(--gold-light);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .playlist-title-area p {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .playlist-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
    }

    .btn-gold {
      background: linear-gradient(135deg, var(--gold-primary) 0%, var(--gold-dark) 100%);
      color: #000;
    }
    .btn-gold:hover {
      opacity: 0.92;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(212, 175, 55, 0.4);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.07);
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    /* Videos Grid */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.2rem;
    }

    .video-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: all 0.25s ease;
      cursor: pointer;
      position: relative;
    }
    .video-card:hover {
      transform: translateY(-4px);
      background: var(--bg-card-hover);
      border-color: rgba(212, 175, 55, 0.4);
      box-shadow: 0 12px 24px -6px rgba(0,0,0,0.6);
    }

    .thumb-box {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      overflow: hidden;
    }
    .thumb-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }
    .video-card:hover .thumb-img {
      transform: scale(1.05);
    }

    .play-badge {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 44px;
      height: 44px;
      background: rgba(0, 0, 0, 0.7);
      border: 2px solid var(--gold-light);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold-light);
      font-size: 1.1rem;
      transition: all 0.2s ease;
    }
    .video-card:hover .play-badge {
      background: var(--gold-primary);
      color: #000;
      transform: translate(-50%, -50%) scale(1.15);
    }

    .hd-badge {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.8);
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--gold-light);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid rgba(212, 175, 55, 0.3);
    }

    .video-info {
      padding: 0.9rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .video-title {
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.4;
      color: var(--text-main);
      margin-bottom: 0.8rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-actions {
      display: flex;
      gap: 6px;
      margin-top: auto;
    }

    .btn-card {
      flex: 1;
      text-align: center;
      padding: 6px 10px;
      font-size: 0.78rem;
    }

    /* Modal Player */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      padding: 1rem;
    }
    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      width: 100%;
      max-width: 900px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      animation: zoomIn 0.25s ease;
    }
    @keyframes zoomIn {
      from { transform: scale(0.95); }
      to { transform: scale(1); }
    }

    .modal-video-wrapper {
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
    }
    .modal-video-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .modal-footer {
      padding: 1rem 1.2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      background: rgba(0, 0, 0, 0.2);
    }

    .modal-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--gold-light);
      flex: 1;
    }

    .modal-btns {
      display: flex;
      gap: 8px;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #22c55e;
      color: #fff;
      font-weight: 600;
      font-size: 0.9rem;
      padding: 10px 22px;
      border-radius: 999px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      z-index: 10000;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      pointer-events: none;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* Floating Back to Top */
    .fab-top {
      position: fixed;
      bottom: 25px;
      right: 25px;
      width: 48px;
      height: 48px;
      background: rgba(28, 30, 36, 0.85);
      border: 1px solid var(--gold-primary);
      border-radius: 50%;
      color: var(--gold-light);
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.25s ease;
      z-index: 90;
    }
    .fab-top.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Responsive */
    @media (max-width: 640px) {
      header {
        padding: 1.5rem 0.8rem 1rem;
      }
      .logo-badge {
        font-size: 0.75rem;
        padding: 3px 10px;
        margin-bottom: 0.5rem;
      }
      h1 {
        font-size: 1.4rem;
      }
      .subtitle {
        font-size: 0.85rem;
        margin-bottom: 0.8rem;
      }
      .stats-bar {
        gap: 0.6rem;
        font-size: 0.78rem;
        margin-bottom: 1rem;
      }
      .stat-item:last-child {
        display: none;
      }
      .search-input {
        font-size: 1rem;
        padding: 10px 16px 10px 40px;
      }
      .year-tabs {
        gap: 5px;
        padding: 4px 0;
      }
      .year-tab-btn {
        padding: 5px 9px;
        font-size: 0.78rem;
      }
      main {
        margin-top: 1rem;
        padding: 0 0.6rem;
      }
      .playlist-section {
        padding: 1rem 0.8rem;
        margin-bottom: 1.5rem;
        border-radius: 12px;
      }
      .playlist-title-area h2 {
        font-size: 1.15rem;
      }
      .playlist-header {
        flex-direction: column;
        gap: 0.8rem;
      }
      .playlist-actions {
        width: 100%;
        flex-direction: column;
      }
      .playlist-actions .btn {
        width: 100%;
        justify-content: center;
      }
      .video-grid {
        grid-template-columns: 1fr;
        gap: 12px;
      }
      .card-actions {
        gap: 5px;
      }
      .btn-card {
        padding: 8px 6px;
        font-size: 0.78rem;
      }
      .modal-content {
        max-width: 100%;
        border-radius: 12px;
      }
      .modal-footer {
        flex-direction: column;
        align-items: stretch;
        gap: 0.8rem;
        padding: 0.8rem 1rem;
      }
      .modal-title {
        font-size: 0.95rem;
      }
      .modal-btns {
        flex-direction: column;
        width: 100%;
      }
      .modal-btns .btn {
        width: 100%;
        justify-content: center;
      }
      .fab-top {
        bottom: 18px;
        right: 18px;
        width: 42px;
        height: 42px;
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>

      <h1>🎬 陳家照片回憶錄</h1>

  </div>

  <!-- Toast -->
  <div class="toast" id="toast">✅ 連結已成功複製到剪貼簿！</div>

  <!-- Back to Top Button -->
  <button class="fab-top" id="fabTop" title="返回頂部">▲</button>

    const mainContainer = document.getElementById('mainContainer');
    const yearTabs = document.getElementById('yearTabs');
    const searchInput = document.getElementById('searchInput');
    const clearBtn = document.getElementById('clearBtn');
    const videoModal = document.getElementById('videoModal');
    const modalIframe = document.getElementById('modalIframe');
    const modalTitle = document.getElementById('modalTitle');
    const modalYtBtn = document.getElementById('modalYtBtn');
    const modalCopyBtn = document.getElementById('modalCopyBtn');
    const modalCloseBtn = document.getElementById('modalCloseBtn');
    const toast = document.getElementById('toast');
    const fabTop = document.getElementById('fabTop');

    let currentYearFilter = 'ALL';
    let currentSearchQuery = '';
    let currentActiveVideo = null;

    // Initialize Year Tabs
    function initTabs() {
      PLAYLISTS.forEach(pl => {
        const btn = document.createElement('button');
        btn.className = 'year-tab-btn';
        btn.dataset.year = pl.year;
        btn.textContent = pl.year;
        yearTabs.appendChild(btn);
      });

      yearTabs.addEventListener('click', (e) => {
        if (e.target.classList.contains('year-tab-btn')) {
          document.querySelectorAll('.year-tab-btn').forEach(b => b.classList.remove('active'));
          e.target.classList.add('active');
          currentYearFilter = e.target.dataset.year;
          render();
          if (window.innerWidth <= 640 || window.scrollY > 120) {
            mainContainer.scrollIntoView({ behavior: 'smooth' });
          }
        }
      });
    }

    // Show Toast
    function showToast(text) {
      toast.textContent = text;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2600);
    }

    // Copy to Clipboard
    function copyText(text, successMsg = '✅ 連結已複製！可直接貼到 LINE 傳給家人') {
      navigator.clipboard.writeText(text).then(() => {
        showToast(successMsg);
      }).catch(() => {
        const el = document.createElement('textarea');
        el.value = text;
        document.body.appendChild(el);
        el.select();
        document.execCommand('copy');
        document.body.removeChild(el);
        showToast(successMsg);
      });
    }

    // Open Modal Player
    function openPlayer(video) {
      currentActiveVideo = video;
      modalTitle.textContent = video.title;
      modalIframe.src = `https://www.youtube-nocookie.com/embed/${video.id}?autoplay=1&rel=0`;
      modalYtBtn.onclick = () => window.open(video.url, '_blank');
      modalCopyBtn.onclick = () => copyText(video.url);
      videoModal.classList.add('open');
    }

    function closePlayer() {
      videoModal.classList.remove('open');
      modalIframe.src = '';
      currentActiveVideo = null;
    }

    modalCloseBtn.addEventListener('click', closePlayer);
    videoModal.addEventListener('click', (e) => {
      if (e.target === videoModal) closePlayer();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closePlayer();
    });

    // Render Playlists and Videos
    function render() {
      mainContainer.innerHTML = '';
      const query = currentSearchQuery.trim().toLowerCase();

      let matchCount = 0;

      PLAYLISTS.forEach(pl => {
        // Filter by year
        if (currentYearFilter !== 'ALL' && pl.year !== currentYearFilter) {
          return;
        }

        // Filter videos by search query
        const matchedVideos = pl.videos.filter(v => {
          if (!query) return true;
          return v.title.toLowerCase().includes(query) || pl.title.toLowerCase().includes(query) || pl.desc.toLowerCase().includes(query);
        });

        if (matchedVideos.length === 0) return;
        matchCount += matchedVideos.length;

        // Build section element
        const section = document.createElement('section');
        section.className = 'playlist-section';
        section.id = `pl-${pl.year}`;

        const headerHtml = `
          <div class="playlist-header">
            <div class="playlist-title-area">
              <h2>📺 《${pl.title}》</h2>
              <p>${pl.desc} · 共 ${pl.count} 部影片</p>
            </div>
            <div class="playlist-actions">
              <a href="${pl.url}" target="_blank" class="btn btn-gold">
                ▶️ 一鍵開啟整年播放清單
              </a>
              <button class="btn btn-secondary copy-pl-btn" data-url="${pl.url}">
                📋 複製清單網址
              </button>
            </div>
          </div>
        `;

        let cardsHtml = '<div class="video-grid">';
        matchedVideos.forEach(v => {
          cardsHtml += `
            <div class="video-card" data-id="${v.id}">
              <div class="thumb-box" data-action="play">
                <img class="thumb-img" src="${v.thumb}" alt="${v.title}" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=600&auto=format&fit=crop&q=60'">
                <div class="play-badge">▶</div>
                <div class="hd-badge">1080p HD</div>
              </div>
              <div class="video-info">
                <div class="video-title" data-action="play">${v.title}</div>
                <div class="card-actions">
                  <button class="btn btn-gold btn-card" data-action="play">▶ 播放</button>
                  <a href="${v.url}" target="_blank" class="btn btn-secondary btn-card" title="在 YouTube 中開啟">↗ YouTube</a>
                  <button class="btn btn-secondary btn-card copy-v-btn" data-url="${v.url}" title="複製網址">📋 複製</button>
                </div>
              </div>
            </div>
          `;
        });
        cardsHtml += '</div>';

        section.innerHTML = headerHtml + cardsHtml;
        mainContainer.appendChild(section);
      });

      if (matchCount === 0) {
        mainContainer.innerHTML = `
          <div style="text-align: center; padding: 4rem 1rem; color: var(--text-muted);">
            <div style="font-size: 3rem; margin-bottom: 1rem;">🔍</div>
            <h3>找不到包含「${currentSearchQuery}」的相片或影片</h3>
            <p style="margin-top: 6px;">請嘗試更換關鍵字，例如「旗山」、「九族」、「自由行」或年份</p>
          </div>
        `;
      }

      // Bind events inside cards
      document.querySelectorAll('.copy-pl-btn').forEach(btn => {
        btn.onclick = (e) => {
          e.stopPropagation();
          copyText(btn.dataset.url, '✅ 播放清單網址已複製！整年份影片一次看');
        };
      });

      document.querySelectorAll('.copy-v-btn').forEach(btn => {
        btn.onclick = (e) => {
          e.stopPropagation();
          copyText(btn.dataset.url, '✅ 影片網址已複製！可貼到 LINE 分享');
        };
      });

      document.querySelectorAll('.video-card').forEach(card => {
        card.addEventListener('click', (e) => {
          if (e.target.closest('.copy-v-btn') || e.target.closest('a')) return;
          const vid = card.dataset.id;
          // Find video object
          for (let pl of PLAYLISTS) {
            const v = pl.videos.find(x => x.id === vid);
            if (v) {
              openPlayer(v);
              break;
            }
          }
        });
      });
    }

    // Search events
    searchInput.addEventListener('input', (e) => {
      currentSearchQuery = e.target.value;
      clearBtn.style.display = currentSearchQuery ? 'block' : 'none';
      render();
    });

    clearBtn.addEventListener('click', () => {
      searchInput.value = '';
      currentSearchQuery = '';
      clearBtn.style.display = 'none';
      render();
      searchInput.focus();
    });

    // Back to top
    window.addEventListener('scroll', () => {
      if (window.scrollY > 300) {
        fabTop.classList.add('show');
      } else {
        fabTop.classList.remove('show');
      }
    });

    fabTop.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // Init on load
    initTabs();
    render();
  </script>
